<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Brush anchor at the selected tile center</title>
  <desc id="desc">A diagram showing a brush marker centered on a selected tile of a 3x3 cube face, with the marker facing the camera as a billboard.</desc>
  <rect width="960" height="640" fill="#f7f9fb"/>
  <text x="80" y="86" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#18202a">Brush anchor at selected tile center</text>
  <text x="80" y="124" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5c6670">The touch point is debug feedback. The brush follows the selected TileID center.</text>

  <g transform="translate(126 180)">
    <polygon points="80,40 380,0 520,170 205,230" fill="#e7eef5" stroke="#2f3b46" stroke-width="4"/>
    <g stroke="#2f3b46" stroke-width="3">
      <line x1="180" y1="27" x2="311" y2="210"/>
      <line x1="280" y1="13" x2="418" y2="190"/>
      <line x1="122" y1="103" x2="426" y2="63"/>
      <line x1="162" y1="166" x2="475" y2="124"/>
    </g>
    <polygon points="162,166 311,210 418,190 270,146" fill="#15b8c7" opacity="0.92" stroke="#0a4650" stroke-width="4"/>
    <text x="302" y="181" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#062b32" text-anchor="middle">TileID center</text>

    <g transform="translate(334 145)">
      <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#1d7fe5" stroke-width="5"/>
      <path d="M-18 14 C-6 -12 7 -22 21 -22 C28 -22 31 -15 27 -9 C18 5 4 18 -14 26 Z" fill="#1d7fe5"/>
      <path d="M-30 31 L-12 22" stroke="#1d7fe5" stroke-width="8" stroke-linecap="round"/>
    </g>

    <circle cx="266" cy="120" r="11" fill="#8e959d"/>
    <text x="96" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#68737d">gray touch dot = raw hit point</text>
    <text x="96" y="340" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0a4650">blue brush = selected tile center</text>
  </g>

  <g transform="translate(690 200)">
    <rect x="0" y="0" width="150" height="104" rx="14" fill="#ffffff" stroke="#9fb0c0" stroke-width="3"/>
    <circle cx="46" cy="52" r="16" fill="#2f3b46"/>
    <circle cx="104" cy="52" r="16" fill="#2f3b46"/>
    <path d="M30 94 C60 122 92 122 124 94" fill="none" stroke="#2f3b46" stroke-width="6" stroke-linecap="round"/>
    <text x="75" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f3b46" text-anchor="middle">Camera</text>
  </g>

  <g stroke="#1d7fe5" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M650 270 C570 250 510 220 462 176"/>
    <path d="M468 199 L462 176 L486 184"/>
  </g>
  <text x="552" y="232" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1d7fe5">SCNBillboardConstraint</text>
</svg>
